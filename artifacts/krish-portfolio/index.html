<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Everything between the seo-head markers is replaced per page by scripts/prerender.ts at build
         time, and kept in sync on client-side navigation by src/seo/use-seo.ts (tags marked data-seo). -->
    <!--seo-head-->
    <title>Krish Khati | AI Developer</title>
    <meta
      data-seo
      name="description"
      content="Krish Khati - AI Developer building AI-powered apps, chatbots and web projects: gym website design, memory match game, AI language translator and calculator app UI."
    />
    <meta data-seo name="robots" content="index, follow" />
    <meta data-seo property="og:type" content="website" />
    <meta data-seo property="og:site_name" content="Krish Khati" />
    <meta
      data-seo
      property="og:title"
      content="Krish Khati | AI Developer"
    />
    <meta
      data-seo
      property="og:description"
      content="Krish Khati - AI Developer building AI-powered apps, chatbots and web projects: gym website design, memory match game, AI language translator and calculator app UI."
    />
    <meta
      data-seo
      property="og:image"
      content="https://krish-portfolio-dev.vercel.app/og-default.png"
    />
    <meta data-seo name="twitter:card" content="summary_large_image" />
    <meta
      data-seo
      name="twitter:title"
      content="Krish Khati | AI Developer"
    />
    <meta
      data-seo
      name="twitter:description"
      content="Krish Khati - AI Developer building AI-powered apps, chatbots and web projects: gym website design, memory match game, AI language translator and calculator app UI."
    />
    <meta
      data-seo
      name="twitter:image"
      content="https://krish-portfolio-dev.vercel.app/og-default.png"
    />
    <!--/seo-head-->
    <meta
      name="keywords"
      content="Krish Khati, AI developer, gym website design, memory match game, AI language translator, calculator app UI, web development, React, Python, chatbots"
    />
    <meta name="theme-color" content="#0d0d0d" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Krish Khati — Blog"
      href="/rss.xml"
    />
    <!-- ?v=2 busts the browser/CDN cache so the new mark shows up without a hard reload. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <!-- Fonts are self-hosted (src/index.css); preload only what the hero needs. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-800-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The hero poster is the LCP image; the video itself loads later (see HeroMedia in App.tsx). -->
    <link
      data-home-only
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="/media/krish-hero-poster-480.avif 480w, /media/krish-hero-poster-768.avif 768w, /media/krish-hero-poster-1200.avif 1200w, /media/krish-hero-poster-1600.avif 1600w"
      imagesizes="100vw"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
