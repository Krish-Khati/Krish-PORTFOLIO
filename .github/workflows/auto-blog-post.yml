name: Auto blog post

on:
  schedule:
    # 10:00 AM IST (UTC+5:30) on Monday, Wednesday and Friday = 04:30 UTC.
    - cron: '30 4 * * 1,3,5'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate today's post
        run: pnpm --filter @workspace/scripts run auto-blog-post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}

      - name: Fetch cover images for new posts
        run: pnpm --filter @workspace/krish-portfolio run fetch-covers --sync-db
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Commit cover images & updated blog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/krish-portfolio/public/blog-covers/ artifacts/krish-portfolio/src/data/blog.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: add cover images for new blog post(s)"
            git push origin main
          else
            echo "No new cover files to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}