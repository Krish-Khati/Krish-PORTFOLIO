name: Auto blog post

on:
  schedule:
    # 10:00 AM IST (UTC+5:30) on Monday, Wednesday and Friday = 04:30 UTC.
    - cron: '30 4 * * 1,3,5'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate today's post
        run: pnpm --filter @workspace/scripts run auto-blog-post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional free backup writer, used only if Gemini fails after retries. The script
          # works fine without this secret — it just has no backup until you add it.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional: set these repo variables (Settings -> Secrets and variables -> Actions ->
          # Variables) to a comma-separated list of model ids to try first, e.g.
          # "gemini-flash-latest,gemini-2.5-flash". Leave unset for fully automatic model
          # selection (ai-model-picker.ts asks each provider what's live and ranks it).
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
